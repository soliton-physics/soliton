[package]
name = "soliton-py"
description = "Python bindings for the Soliton Physics engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "soliton"
crate-type = ["cdylib"]

[dependencies]
soliton-fields = { workspace = true }
soliton-mechanics = { workspace = true }
soliton-optics = { workspace = true }
soliton-thermal = { workspace = true }
num-complex = { workspace = true }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
serde_json = { workspace = true }
