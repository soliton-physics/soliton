name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path crates/soliton-py/Cargo.toml
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/soliton-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz -o wasm-pack.tar.gz
          tar xzf wasm-pack.tar.gz
          mv wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack "$HOME/.cargo/bin/"
          wasm-pack --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: wasm-pack build --release --target web --out-dir pkg --scope soliton-physics
        working-directory: crates/soliton-wasm
      # setup-node is used without registry-url: with it, a placeholder NODE_AUTH_TOKEN is injected and npm
      # authenticates with that instead of the OIDC exchange. Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest
      - run: npm pkg set name=@soliton-physics/engine && npm pkg set 'keywords[]=physics'
        working-directory: crates/soliton-wasm/pkg
      - run: npm --version && echo "id-token request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm publish --access public --provenance --loglevel info
        working-directory: crates/soliton-wasm/pkg
