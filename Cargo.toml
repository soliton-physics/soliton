[workspace]
resolver = "2"
members = [
    "crates/soliton-core",
    "crates/soliton-fields",
    "crates/soliton-mechanics",
    "crates/soliton-wasm",
    "crates/soliton-py",
]
default-members = ["crates/soliton-core", "crates/soliton-fields", "crates/soliton-mechanics"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soliton-physics/soliton"
authors = ["Soliton Physics contributors"]

[workspace.dependencies]
soliton-core = { path = "crates/soliton-core", version = "0.1.0" }
soliton-fields = { path = "crates/soliton-fields", version = "0.1.0" }
soliton-mechanics = { path = "crates/soliton-mechanics", version = "0.1.0" }
num-complex = "0.4"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
